server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4m;
    }

    # Only the built public HTML triggers token creation. This is not a public CSRF API.
    location = /_html-token {
        internal;
        proxy_pass http://backend:8080/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        auth_request /_html-token;
        auth_request_set $csrf_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $csrf_cookie always;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        rewrite ^ /index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
