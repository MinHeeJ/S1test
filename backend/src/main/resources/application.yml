spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/resumecraft}
    username: ${DB_USER:resumecraft}
    password: ${DB_PASSWORD:dev-only-password}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-handlers-package: com.resumecraft.common.persistence
  configuration:
    map-underscore-to-camel-case: true
