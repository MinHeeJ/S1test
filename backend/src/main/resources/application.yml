spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/resumecraft}
    username: ${DB_USER:resumecraft}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    placeholder-replacement: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  jackson:
    time-zone: UTC
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
mybatis:
  mapper-locations: classpath*:mappers/*.xml,classpath*:mapper/*.xml
  type-handlers-package: com.resumecraft.common
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
