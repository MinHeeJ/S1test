spring:
  application:
    name: resumecraft
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/resumecraft}
    username: ${DB_USER:resumecraft}
    password: ${DB_PASSWORD:dev-only-password}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
mybatis:
  mapper-locations: classpath*:mappers/**/*.xml,classpath*:mapper/**/*.xml
  type-handlers-package: com.example.common.persistence
  configuration:
    map-underscore-to-camel-case: true
