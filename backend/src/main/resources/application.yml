spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resumecraft}
    username: ${DB_USER:resumecraft}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    # Dollar-quoted JSON seeds are literal SQL, not Flyway ${...} placeholders.
    # PostgreSQL dollar-quoted JSON is literal SQL, not a Flyway placeholder.
    placeholder-replacement: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
mybatis:
  mapper-locations: classpath*:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
