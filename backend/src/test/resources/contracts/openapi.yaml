openapi: 3.1.0
info:
  title: ResumeCraft HTTP API 계약
  version: 0.1.0
  description: spec.md와 requirement-registry.json의 title·statement·acceptance_hint·source_locator만을 근거로 재생성한 ResumeCraft API
    설계 계약이다. 기존 path/METHOD/operationId를 보존한다. 실제 동작·클라이언트 계약·실행 제약은 operation별로 구분하며 참조 추가가 정책 승인이나 실행 성공을 뜻하지 않는다. 미정 성공
    wire 표현·보안·pagination·영속성 정책은 확인 필요이다.
paths:
  /api/auth/signup:
    post:
      operationId: signup
      summary: 회원가입
      x-related-requirements:
      - REQ-001
      - REQ-003
      - REQ-035
      - REQ-036
      - REQ-050
      - REQ-051
      - REQ-085
      - REQ-114
      - REQ-115
      security: []
      responses:
        '204':
          description: '성공: 회원가입; 본문 없는 응답의 설계 제안'
        '400':
          description: 가입 email 형식·nickname 2~12자·password 8자 이상 입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'DUPLICATE_EMAIL: 이미 가입된 이메일입니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      x-no-response-data-reason: 원문은 신규 응답 데이터가 아니라 자동 로그인·화면 이동을 약속한다. 204와 응답 생략은 OQ-012 확인 전 미승인 제안이다.
      x-business-rules:
      - 가입 email은 원문 이메일 정규식에 맞아야 한다. nickname은 2~12자, password는 8자 이상이다(REQ-051).
      - 비밀번호 확인 일치를 검사하고 가입 성공 뒤 자동 로그인하여 /resumes로 이동한다(REQ-050). 확인값 서버 전송은 OQ-004.
      - users.email은 unique이며 중복은 409 DUPLICATE_EMAIL, 이미 가입된 이메일입니다로 거부한다(REQ-051).
      - 'REQ-003: 권한·관리자, 공유 링크, 버전 기록, 휴지통, 사진 자르기, 실행 취소, 소셜 로그인, 동시 편집 충돌 처리, 브라우저 저장소는 제외한다. 리소스 API를 이 기능들로 확장하지 않는다.'
      x-side-effects:
      - users에 새 계정을 저장하고 password_hash를 BCrypt로 보관한다(REQ-035, REQ-050).
      - 가입 성공 시 인증 세션을 시작하며 같은 세션으로 본인 이력서 목록에 접근한다(REQ-050).
      x-required-tests:
      - 'happy: 유효한 신규 email·nickname·8자 이상 password·확인 일치로 가입 -> users에 email 행이 있고 같은 세션 GET /api/resumes 성공 후 /resumes로
        이동한다'
      - 'auth: 비로그인에서 유효 가입 요청 -> 인증 때문에 401로 거부되지 않고 가입 뒤 GET /api/auth/me의 nickname이 가입값이다; 가입 자체는 공개 API이다'
      - 'validation: email=abc@ 또는 nickname 한 글자 또는 password 7자로 가입 -> 400의 field가 해당 입력을 가리키며 users에 새 행이 없다'
      - 'business: jiwoo@resume.dev로 재가입 -> 409 DUPLICATE_EMAIL·이미 가입된 이메일입니다와 users 동일 email 행수 불변'
      - 'side-effect: 신규 가입 성공 -> users.password_hash가 입력 평문과 다르고 BCrypt 검증 성공, 후속 보호 API 호출이 같은 세션으로 허용된다'
      x-state-transitions:
      - 비로그인 -> 가입 성공 후 로그인 세션
      x-open-questions:
      - 'OQ-004: 확인값의 wire 이름·서버 검사 위치·cookie/CSRF'
      - 'OQ-009: 오류 envelope 정합성'
      - 'OQ-012: 성공 상태·본문 생략 승인'
      x-contract-status: clarification_required
      description: 가입 입력 검증·users 저장·자동 로그인 세션을 제공한다. /signup과 가입 뒤 /resumes 이동 및 헤더는 클라이언트 책임이다. 역할·소셜 로그인은 제외 범위이며 추가하지
        않는다.
      x-requirement-evidence:
      - canonical_id: REQ-001
        title: 이용 범위
        statement: 역할·권한 없이 로그인 사용자는 모든 기능, 비로그인은 로그인·회원가입만 본다
        acceptance_hint: 비로그인 /resumes는 /login, 로그인은 모든 포함 기능 이용
        source_locator: &id001
          document: SPEC-REQUEST.md
          line: 22
          quote: '- 역할·권한 없음. 로그인 사용자는 모든 기능을 쓴다. 비로그인은 로그인·회원가입 화면만 본다.'
        responsibility: 이 operation의 데이터·세션·저장 결과를 사용하는 클라이언트 계약. 로컬 동작을 새 서버 operation으로 만들지 않는다.
      - canonical_id: REQ-003
        title: 제외 범위
        statement: 권한·관리자, 공유 링크, 버전 기록, 휴지통, 사진 자르기, 실행 취소, 소셜 로그인, 동시 편집 충돌 처리, 브라우저 저장소 제외
        acceptance_hint: 제외 목록 기능을 제품 기능으로 생성하지 않음
        source_locator: &id002
          document: SPEC-REQUEST.md
          line: 26
          quote: '- 권한·관리자, 공유 링크, 버전 기록, 휴지통, 사진 자르기, 실행 취소, 소셜 로그인, 동시 편집 충돌 처리, 브라우저 저장소'
        responsibility: '범위 제약: 해당 리소스 조작에 제외 기능을 추가하지 않는다.'
      - canonical_id: REQ-035
        title: 비밀번호 BCrypt
        statement: 비밀번호 BCrypt
        acceptance_hint: users.password_hash BCrypt이며 평문 없음
        source_locator: &id003
          document: SPEC-REQUEST.md
          line: 61
          quote: '- 미리보기는 서버를 거치지 않는다. 비밀번호 BCrypt.'
        responsibility: '구현·실행 또는 통합 검증 제약: HTTP 응답만으로 충족을 판정하지 않는다.'
      - canonical_id: REQ-036
        title: 화면 경로
        statement: /login, /signup, /resumes, /resumes/:id/edit, /print/:id, /는 /resumes, print는 iframe 전용
        acceptance_hint: 루트 리디렉션과 iframe 인쇄 경로 확인
        source_locator: &id004
          document: SPEC-REQUEST.md
          line: 108
          quote: '- /login, /signup, /resumes(첫 화면, / 는 여기로), /resumes/:id/edit, /print/:id(iframe 전용)'
        responsibility: 이 operation의 데이터·세션·저장 결과를 사용하는 클라이언트 계약. 로컬 동작을 새 서버 operation으로 만들지 않는다.
      - canonical_id: REQ-050
        title: 회원가입
        statement: 가입 성공 자동 로그인 후 /resumes
        acceptance_hint: FR-101 AC-01 가입 세션·목록, AC-02 중복409 이미 가입된 이메일입니다; api_endpoint:POST /api/auth/signup
        source_locator:
          document: SPEC-REQUEST.md
          line: 142
          quote: '- 로그인: 이메일·비밀번호. 가입: 이메일(서버도 형식 검사), 닉네임 2~12자, 비밀번호 8자 이상, 비밀번호 확인. 가입 성공 시 자동 로그인 후 /resumes. 로그아웃 시 /login.'
        responsibility: 해당 리소스의 HTTP 동작 또는 후속 조회·검증 근거.
      - canonical_id: REQ-051
        title: 가입 검증
        statement: 이메일 서버 형식, 닉네임2~12자, 비밀번호8자 이상·확인
        acceptance_hint: 잘못된 이메일·길이400 및 중복409; api_endpoint:POST /api/auth/signup
        source_locator:
          document: SPEC-REQUEST.md
          line: 142
          quote: '- 로그인: 이메일·비밀번호. 가입: 이메일(서버도 형식 검사), 닉네임 2~12자, 비밀번호 8자 이상, 비밀번호 확인. 가입 성공 시 자동 로그인 후 /resumes. 로그아웃 시 /login.'
        responsibility: 해당 리소스의 HTTP 동작 또는 후속 조회·검증 근거.
      - canonical_id: REQ-085
        title: 사용자 시드
        statement: 'Flyway 사진 없는 시드: 사용자(비밀번호 demo1234): jiwoo@resume.dev(지우), minjun@resume.dev(민준), seoyeon@resume.dev(서연)'
        acceptance_hint: demo1234로 세 사용자 로그인
        source_locator: &id005
          document: SPEC-REQUEST.md
          line: 130
          quote: '- 사용자(비밀번호 demo1234): jiwoo@resume.dev(지우), minjun@resume.dev(민준), seoyeon@resume.dev(서연)'
        responsibility: 영속 데이터 또는 시드의 저장·조회 검증 근거.
      - canonical_id: REQ-114
        title: 에러 상태·코드 분류
        statement: 미로그인 401과 로그인 이동, 없음·삭제·타인404, 입력·구조·지원 형식400, 중복 이메일409, 파일·content 크기413을 원문 코드로 구분한다.
        acceptance_hint: 미로그인 보호 API는401·로그인 이동; 타인404; 사진 형식400·크기413; 중복가입409.; api_endpoint:GET /api/resumes/{id}; api_endpoint:PUT
          /api/resumes/{id}; api_endpoint:POST /api/photos; api_endpoint:POST /api/auth/signup
        source_locator: &id016
          document: SPEC-REQUEST.md
          line: 102
          quote: '- 401 미로그인(로그인 화면으로 이동), 404 없음·삭제·타인, 400 입력 오류·INVALID_STRUCTURE·UNSUPPORTED_FILE_TYPE, 409 DUPLICATE_EMAIL,
            413 FILE_TOO_LARGE·CONTENT_TOO_LARGE.'
        responsibility: 해당 리소스의 HTTP 동작 또는 후속 조회·검증 근거.
      - canonical_id: REQ-115
        title: 오류 필드 계약
        statement: 오류 응답은 code, message, field를 포함하는 원문 형식을 보존한다.
        acceptance_hint: 입력 오류 응답에서 code·message·field를 확인하고 원문 DUPLICATE_EMAIL 등 코드를 구분한다. envelope 정합성은 OQ-009.; api_endpoint:GET
          /api/resumes/{id}; api_endpoint:PUT /api/resumes/{id}; api_endpoint:POST /api/photos; api_endpoint:POST /api/auth/signup
        source_locator: &id017
          document: SPEC-REQUEST.md
          line: 103
          quote: '- 오류 응답: { code, message, field }'
        responsibility: 해당 리소스의 HTTP 동작 또는 후속 조회·검증 근거.
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      x-related-requirements:
      - REQ-001
      - REQ-002
      - REQ-003
      - REQ-035
      - REQ-036
      - REQ-052
      - REQ-085
      security: []
      responses:
        '204':
          description: '성공: 로그인; 본문 없는 응답의 설계 제안'
        '400':
          description: 입력 오류; 세부 필드 조건 확인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-no-response-data-reason: 로그인 결과는 세션 수립이며 nickname은 GET /api/auth/me에서 조회한다. 204 본문 생략은 OQ-012 미승인 제안이다.
      x-business-rules:
      - email·password로 기존 users를 인증한다(REQ-052).
      - 시드 계정은 demo1234로 로그인하고 본인 이력서만 이용한다(REQ-002, REQ-085). 로그인 실패 code/status는 OQ-004이다.
      - 'REQ-003: 권한·관리자, 공유 링크, 버전 기록, 휴지통, 사진 자르기, 실행 취소, 소셜 로그인, 동시 편집 충돌 처리, 브라우저 저장소는 제외한다. 리소스 API를 이 기능들로 확장하지 않는다.'
      x-side-effects:
      - 인증 성공 시 Spring Security 세션을 시작한다(REQ-052).
      - 로그인으로 users·resume·photo 신규 행을 생성하지 않는다; 후속 본인 목록 접근이 허용된다(REQ-052).
      x-required-tests:
      - 'happy: jiwoo@resume.dev·demo1234로 로그인 -> 같은 세션 me.nickname=지우, 목록에서 지우 이력서 세 건 조회'
      - 'auth: 로그인 전 보호 GET /api/resumes 호출 -> 401; 유효 login 뒤 같은 GET -> 본인 목록 응답'
      - 'validation: LoginRequest의 email을 누락하여 요청 -> 400 입력 오류, field=email; 기존 users.password_hash 불변(구조 검증 wire 제안)'
      - 'business: 지우로 로그인한 뒤 민준 resume를 조회 -> 404, 민준 resume.content 불변'
      - 'side-effect: 유효 로그인 전후 users·resume·photo 행수 비교 -> 동일하고 인증 세션의 후속 GET /api/auth/me에서 지우 nickname 확인'
      x-state-transitions:
      - 비로그인 -> 자격 증명 확인 성공 후 로그인 세션
      x-open-questions:
      - 'OQ-004: 잘못된 자격 증명의 status/code 및 세션 보안 정책 미정'
      - 'OQ-012: 성공 응답 미정'
      x-contract-status: clarification_required
      description: users 자격 증명으로 로그인 세션을 수립한다. 로그인 화면·후속 본인 목록과 시드 인증 검증을 지원한다. 잘못된 자격 증명의 응답 상세는 OQ-004이며 추측하지 않는다.
