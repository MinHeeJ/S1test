x-design-projection-policy:
- 확정 필드·행동과 wire 후보를 구분한다. OQ 해소 전 미지정 status/data·pagination·role·감사 기록을 발명하지 않는다.
- x-roles의 로그인 사용자는 원문 접근 조건이며 새 role enum·RBAC·권한 테이블이 아니다.
- 성공 상태 미지정은 2XX 범위로 표기한다. 이는 200/201/204 선택 완료가 아니며 OQ-011 해소 후 구체화한다.
- 성공 data 미지정의 response는 envelope만 표시하고 x-response-data-status=clarification_required로 차단한다. 이를 의도적 무결과 완료 계약으로 해석하지 않는다.
- JSON/multipart·cookie·id 응답 표현은 후보 표시된 곳에서 사용자 승인 전 코드 확정 금지.
- 원문의 단일 field 오류는 보존한다. field-level 경로·null·필수 및 message 세부값은 OQ-011이며 fabricated fields map을 추가하지 않는다.
