openapi: 3.0.3
info:
  title: ResumeCraft HTTP API 계약
  version: 0.1.0
  description: '승인된 spec.md·plan.md·tasks.md와 117개 원장의 설계 투영. API 계약 버전 0.1.0은 문서 식별자이지 Version BOM이 아니다. clarification_required:
    영속성 선택 OQ-001, 인증/wire OQ-005/006/011, 목록 pagination OQ-010 미해소. 추정 답변은 승인 아님. 부분 정의를 build-ready로 사용하지 않는다.'
servers:
- url: /
  description: 같은 서비스 nginx /api 프록시; 실제 host·port는 후속 운영 계약.
paths:
  /api/auth/signup:
    post:
      operationId: signup
      summary: 회원가입 및 자동 로그인
      description: 회원가입 및 자동 로그인의 승인 요구 행동을 HTTP 경계로 투영한다. 미정 wire 정책은 x-open-questions를 따른다.
      x-related-requirements:
      - REQ-088
      - REQ-089
      - REQ-036
      - REQ-041
      - REQ-061
      - REQ-062
      security: []
      responses:
        2XX:
          description: 요청 성공. 정확 상태·응답 추가 필드는 OQ-011.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 가입 이메일 형식·닉네임2~12·비밀번호8 이상 위반; field의 정확 경로와 확인 비밀번호 전송 정책 OQ-005/011.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: DUPLICATE_EMAIL; message=이미 가입된 이메일입니다; users 추가 없음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        description: 가입 입력. JSON 전송은 OQ-005 후보; 화면의 비밀번호 확인과 HTTP 필드를 구분한다.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      x-business-rules:
      - 가입 이메일은 서버도 형식을 검사하고 users.email 중복을 허용하지 않는다.
      - 닉네임은2~12자, 비밀번호는8자 이상이며 화면에서 비밀번호 확인을 제공한다. 확인 전송·검사 위치는 OQ-005.
      - 신규 비밀번호는 BCrypt hash로 users.password_hash에 저장한다. 성공한 가입은 자동 로그인한다.
      x-side-effects:
      - users에 신규 계정과 BCrypt password_hash를 저장한다.
      - Spring Security 세션 인증이 성립하여 /resumes로 진입할 수 있다.
      x-state-transitions:
      - 세션 미인증 -> 가입 사용자 인증
      x-required-tests:
      - 'happy: 신규 유효 email·nickname 2~12자·password 8자 이상 및 화면 확인 일치로 가입 -> users 신규 row와 같은 세션 /api/auth/me의 현재 사용자·/resumes
        진입 확인'
      - 'auth: 세션 없이 신규 유효 가입 -> 로그인 선행 없이 users 생성·자동 인증으로 보호 목록에 접근'
      - 'validation: nickname 1자 또는13자와 password 7자로 가입 ->400 입력 오류·users 추가 없음; field 구체 경로는 OQ-011 해소 후 assertion 확정'
      - 'business: 이미 존재하는 users.email로 가입 ->409 DUPLICATE_EMAIL·이미 가입된 이메일입니다·users row 수 불변'
      - 'side-effect: 가입 완료 후 users.password_hash 조회·같은 비밀번호로 로그인 ->평문과 다른 BCrypt hash 저장 및 동일 계정 인증'
      x-open-questions:
      - 'OQ-005: 실제 Content-Type·확인 비밀번호 HTTP 이름·서버 일치 검사·성공 data.'
      - 'OQ-006: 세션 cookie·CSRF·TTL.'
      - 'OQ-011/OQ-017: 성공 상태·오류 field·id/시각 생성.'
      x-response-data-status: clarification_required
      x-source-evidence:
      - canonical_id: REQ-088
        source_document: SPEC-REQUEST.md
        line: 142
        quote: '- 로그인: 이메일·비밀번호. 가입: 이메일(서버도 형식 검사), 닉네임 2~12자, 비밀번호 8자 이상, 비밀번호 확인. 가입 성공 시 자동 로그인 후 /resumes. 로그아웃 시 /login.'
      - canonical_id: REQ-089
        source_document: SPEC-REQUEST.md
        line: 142
        quote: '- 로그인: 이메일·비밀번호. 가입: 이메일(서버도 형식 검사), 닉네임 2~12자, 비밀번호 8자 이상, 비밀번호 확인. 가입 성공 시 자동 로그인 후 /resumes. 로그아웃 시 /login.'
      - canonical_id: REQ-036
        source_document: SPEC-REQUEST.md
        line: 61
        quote: '- 미리보기는 서버를 거치지 않는다. 비밀번호 BCrypt.'
      - canonical_id: REQ-041
        source_document: SPEC-REQUEST.md
        line: 72
        quote: '- users(id, email unique, nickname, password_hash, created_at, updated_at)'
      - canonical_id: REQ-061
        source_document: SPEC-REQUEST.md
        line: 102
        quote: '- 401 미로그인(로그인 화면으로 이동), 404 없음·삭제·타인, 400 입력 오류·INVALID_STRUCTURE·UNSUPPORTED_FILE_TYPE, 409 DUPLICATE_EMAIL,
          413 FILE_TOO_LARGE·CONTENT_TOO_LARGE.'
      - canonical_id: REQ-062
        source_document: SPEC-REQUEST.md
        line: 103
        quote: '- 오류 응답: { code, message, field }'
      x-contract-status: clarification_required
  /api/auth/login:
    post:
      operationId: login
      summary: 이메일·비밀번호 로그인
      description: 이메일·비밀번호 로그인의 승인 요구 행동을 HTTP 경계로 투영한다. 미정 wire 정책은 x-open-questions를 따른다.
      x-related-requirements:
      - REQ-090
      - REQ-039
      - REQ-036
      security: []
      responses:
        2XX:
          description: 요청 성공. 정확 상태·응답 추가 필드는 OQ-011.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        4XX:
          description: 자격증명 실패 세부 status/code는 OQ-005; envelope를 정하며 특정401/400로 확정하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        description: 이메일·비밀번호 전송 후보. 잘못된 자격증명의 status/code는 OQ-005.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      x-business-rules:
      - 가입된 사용자의 이메일·비밀번호로 인증한다.
      - BCrypt password_hash와 자격증명을 비교하며 업무 users row를 변경하는 로그인 기능은 요구하지 않는다.
      x-side-effects:
      - Spring Security 세션 인증이 성립하고 동일 세션 getCurrentUser와 자기 이력서 접근이 가능해진다.
      x-state-transitions:
      - 세션 미인증 -> 로그인 사용자 인증
      x-required-tests:
      - 'happy: jiwoo@resume.dev/demo1234 로그인 ->같은 세션 GET /api/auth/me로 현재 사용자 지우와 연결'
      - 'auth: 로그인 전 세션 없이 GET /api/resumes ->401; 로그인 성공 후 같은 세션 GET ->자기 활성 목록 반환'
      - 'business: 민준 계정으로 로그인 후 지우 resume 단건 GET ->404·지우 내용 미제공'
      - 'side-effect: 정상 로그인 전후 users.password_hash 비교 ->hash 불변 및 새 인증 세션의 보호 API 접근 성립'
      - 'sequence: 지우 로그인 성공 후 헤더 조회·목록 진입 ->헤더 닉네임 지우·지우 활성3건 표시'
      - 'validation: verify login contract'
      x-test-open-questions:
      - 'validation: 실패 자격증명·누락 필드의 정확 status/code/field는 OQ-005/011. 확인 전 거부 규칙을 추측한 assertion을 만들지 않는다.'
      x-open-questions:
      - 'OQ-005: Content-Type·실패 자격증명 상태·성공 result.'
      - 'OQ-006: 세션/CSRF·로그인 세션 교체 세부.'
      x-response-data-status: clarification_required
      x-source-evidence:
      - canonical_id: REQ-090
        source_document: SPEC-REQUEST.md
        line: 142
        quote: '- 로그인: 이메일·비밀번호. 가입: 이메일(서버도 형식 검사), 닉네임 2~12자, 비밀번호 8자 이상, 비밀번호 확인. 가입 성공 시 자동 로그인 후 /resumes. 로그아웃 시 /login.'
      - canonical_id: REQ-039
        source_document: SPEC-REQUEST.md
        line: 68
        quote: '- DB: PostgreSQL 16. 인증: Spring Security 세션. signup·login·health 외 /api/** 는 로그인만 확인.'
      - canonical_id: REQ-036
        source_document: SPEC-REQUEST.md
        line: 61
        quote: '- 미리보기는 서버를 거치지 않는다. 비밀번호 BCrypt.'
      x-contract-status: clarification_required
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: 로그아웃의 승인 요구 행동을 HTTP 경계로 투영한다. 미정 wire 정책은 x-open-questions를 따른다.
      x-related-requirements:
      - REQ-091
      - REQ-001
      - REQ-039
      security:
      - sessionCookie: []
      responses:
        2XX:
          description: 요청 성공. 정확 상태·응답 추가 필드는 OQ-011.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: '미로그인: 로그인 화면으로 이동. code/field 정확값 OQ-011.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles:
      - 로그인 사용자
      x-no-request-body-reason: 현재 인증 세션을 종료하는 명령으로 사용자·이력서 식별자 입력이 없으며 세션 컨텍스트를 사용한다. CSRF 전송 위치는 OQ-006.
      x-business-rules:
      - signup/login/health 외 보호 API인 logout은 로그인 세션을 확인한다.
      - 로그아웃 후 /resumes 진입은 로그인 화면으로 이동한다.
      x-side-effects:
      - 현재 Spring Security 인증 세션을 무효화하여 이후 보호 API 요청이401이 된다.
      x-state-transitions:
      - 로그인 사용자 인증 -> 세션 종료·미인증
      x-required-tests:
      - 'happy: 로그인 세션에서 logout 후 같은 세션으로 GET /api/auth/me ->401·인증 사용자 미반환'
      - 'auth: 세션 없이 POST /api/auth/logout ->401·인증 세션 생성 없음'
      - 'business: 로그아웃 완료 뒤 /resumes에 재진입 ->/login으로 이동·이력서 카드 표시 없음'
      - 'side-effect: 로그아웃 후 이전 세션으로 GET /api/resumes ->401·기존 users/resume row 불변'
      - 'sequence: 로그아웃 성공 후 헤더·화면 ->/login으로 이동하고 보호 편집 route도 접근 불가'
      - 'validation: verify logout contract'
      x-test-open-questions:
      - 'validation: 업무 입력 필드 없는 세션 명령이다. malformed body 처리·CSRF 오류 상세는 OQ-006; 새 validation 정책을 만들지 않는다.'
      x-response-data-status: clarification_required
      x-open-questions:
      - 'OQ-011: 성공 status·응답 data 유무. 미정 값을 bodyless204로 확정하지 않는다.'
      - 'OQ-006: cookie 제거·CSRF·세션 저장 모델.'
      x-source-evidence:
      - canonical_id: REQ-091
        source_document: SPEC-REQUEST.md
        line: 142
        quote: '- 로그인: 이메일·비밀번호. 가입: 이메일(서버도 형식 검사), 닉네임 2~12자, 비밀번호 8자 이상, 비밀번호 확인. 가입 성공 시 자동 로그인 후 /resumes. 로그아웃 시 /login.'
      - canonical_id: REQ-001
        source_document: SPEC-REQUEST.md
        line: 22
        quote: '- 역할·권한 없음. 로그인 사용자는 모든 기능을 쓴다. 비로그인은 로그인·회원가입 화면만 본다.'
      - canonical_id: REQ-039
        source_document: SPEC-REQUEST.md
        line: 68
        quote: '- DB: PostgreSQL 16. 인증: Spring Security 세션. signup·login·health 외 /api/** 는 로그인만 확인.'
      x-contract-status: clarification_required
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: 현재 사용자 조회
      description: 현재 사용자 조회의 승인 요구 행동을 HTTP 경계로 투영한다. 미정 wire 정책은 x-open-questions를 따른다.
      x-related-requirements:
      - REQ-092
      - REQ-027
      - REQ-001
      security:
      - sessionCookie: []
      responses:
        2XX:
          description: 요청 성공. 정확 상태·응답 추가 필드는 OQ-011.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
                  required:
                  - data
        '401':
          description: '미로그인: 로그인 화면으로 이동. code/field 정확값 OQ-011.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles:
      - 로그인 사용자
      x-open-questions:
      - 'OQ-005: nickname 최소 투영 외 반환 필드와 wire shape 확정.'
      x-source-evidence:
      - canonical_id: REQ-092
        source_document: SPEC-REQUEST.md
        line: 145
        quote: '- POST /api/auth/signup, /api/auth/login, /api/auth/logout, GET /api/auth/me'
      - canonical_id: REQ-027
        source_document: SPEC-REQUEST.md
        line: 54
        quote: '- CMN-701: 헤더(로고, 닉네임, 로그아웃), 편집기는 툴바. 편집기는 1024px 이상 좌우 분할, 미만은 [입력][미리보기] 탭.'
      - canonical_id: REQ-001
        source_document: SPEC-REQUEST.md
        line: 22
        quote: '- 역할·권한 없음. 로그인 사용자는 모든 기능을 쓴다. 비로그인은 로그인·회원가입 화면만 본다.'
      x-contract-status: clarification_required
  /api/resumes:
    get:
      operationId: listResumes
      summary: 자기 이력서 목록
      description: 자기 이력서 목록의 승인 요구 행동을 HTTP 경계로 투영한다. 미정 wire 정책은 x-open-questions를 따른다.
      x-related-requirements:
      - REQ-093
      - REQ-002
      - REQ-042
      security:
      - sessionCookie: []
      responses:
        2XX:
          description: 요청 성공. 정확 상태·응답 추가 필드는 OQ-011.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Resume'
                  required:
                  - data
        '401':
          description: '미로그인: 로그인 화면으로 이동. code/field 정확값 OQ-011.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles:
      - 로그인 사용자
      x-pagination:
        decision_status: clarification_required
        reason: 'OQ-010: 원문은 최근 수정순 자기 활성 목록만 선언한다. 전체 목록인지 page/size인지, bounded set인지도 미지정이므로 no-pagination을 승인값으로 선언할 수
          없다.'
      x-open-questions:
      - 'OQ-010: 페이지·필터·정렬 parameter·page/size와 meta 총계 계약. 현재 원문에 없는 query parameter를 추가하지 않는다.'
      - 'OQ-011: 목록 item 응답 키·content를 목록에 포함할지 상세GET으로 렌더할지. Resume schema는 관찰상 최소 렌더 데이터의 후보.'
      - 'OQ-017: updated_at 정밀도·null·동률 순서.'
      x-required-tests:
      - 'happy: 지우 로그인 세션 GET /api/resumes ->본인 활성3건·최근 수정순, 민준 row와 deleted=true 서연 row 제외'
      - 'auth: 무세션 GET /api/resumes ->401·목록 데이터 미반환'
      x-source-evidence:
      - canonical_id: REQ-093
        source_document: SPEC-REQUEST.md
        line: 155
        quote: '- 카드 그리드(2~4열), 최근 수정순. 첫 칸은 [+ 새 이력서].'
      - canonical_id: REQ-002
        source_document: SPEC-REQUEST.md
        line: 23
        quote: '- 사용자는 자기 이력서·사진만 조회·수정한다. 타인 데이터는 404.'
      - canonical_id: REQ-042
        source_document: SPEC-REQUEST.md
        line: 73
        quote: '- resume(id, user_id, title, template ''classic''|''modern'', style jsonb, content jsonb, deleted, created_at,
          updated_at). 삭제는 deleted=true이며 이후 어디서든 404.'
      x-contract-status: clarification_required
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
