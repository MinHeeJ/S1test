x-cms-1753-implementation-review: '## CMS-1753 구현 인계 정리 — 2026-10-13


  이 절은 CMS-1753의 변경 구현에 적용되는 최신 정리이며, 이전 문서의 OQ-CHANGE-01~05 및 OQ-BASELINE-01 보류 문구보다 우선한다. 품질 이슈 수용·HITL 승인·코드 실행은 사용자가 수행한다.
  실제 제품 시험은 아직 실행하지 않았다.


  - 요구 원장: 생성 당시 보존된 58개 요구의 원문 인용을 모두 spec-request.md 실제 행과 대조하여 복원했다. REQ-116~173은 spec.md/plan.md/tasks.md와 동일한 의미로 연결한다.
  모델 원장 58개가 기계 재구축 22개로 덮여 발생한 참조 단절이며, 요구 내용을 없애지 않는다.

  - CHK 금액 기준: 제외 기능(세금계산서·결제·다중 통화 등)에 계산 한도를 추가하지 않는다. CMN-921~925의 정수 수량 0~99,999, 단가 0~999,999,999, 최대 50행, 빈 입력 0, 정수
  곱·합, separate/included/exempt 공식과 floor, 한글 금액 예시를 그대로 사용한다. A4/직인 60×60px contain 외에 임의 응답 시간·배율·허용 오차 기준을 만들지 않는다.

  - 마이그레이션: 현재 S1 main 779fa29에 V1__resume_schema.sql 및 V2__resume_demo_seed.sql이 이미 있다. 원문의 V2__invoice.sql은 증분 마이그레이션 예시
  파일명으로 해석하고 실제 구현 파일명은 V3__invoice.sql로 한다. 작업 착수 시 더 높은 버전이 있으면 그 다음 버전을 사용한다. 기존 파일과 checksum을 변경하거나 기존 V2를 덮어쓰지 않는다. invoice와
  요청의 5개 시드를 같은 새 버전에서 추가한다.

  - OQ-BASELINE-01: 기존 backend/pom.xml의 MyBatis starter, ResumeService/ResumeMapper 및 mappers XML을 재사용한다. JPA로 교체하지 않는다. 기존
  SecurityConfig의 JSESSIONID 세션·XSRF-TOKEN cookie/X-XSRF-TOKEN header, /api/health CSRF bootstrap, same-origin API client를
  재사용한다. 성공 응답은 기존 ApiResponse {success:true,meta:{},data}, 오류는 {success:false,meta:{},code,message,field}, PUT/DELETE 성공은
  본문 없는 204, 생성/복제/변환은 201과 data.id를 사용한다. content 한도는 기존 ResumeStructureValidator와 동일한 JSON UTF-8 200000 bytes. 새 인증·CSRF·응답
  규약을 발명하거나 이력서 API를 변경하지 않는다.

  - OQ-CHANGE-01: 원문의 ''입금 완료 토글''대로 청구서는 false↔true를 저장할 수 있다. 입금 완료를 문서 잠금/회계 확정으로 해석하지 않는다. 입금된 청구서도 편집·계산·저장 가능하고 content
  변경만으로 paid를 자동 해제하지 않는다. 견적서는 항상 false이며 paid=true 요청은 400, 원문·금액 불변을 확인한다.

  - OQ-CHANGE-02: 번호는 삭제를 포함한 사용자·종류·Asia/Seoul 연도별 MAX+1과 unique(user_id,doc_no), 충돌 시 서버 재시도 1회를 유지한다. 각 시도는 실패 트랜잭션을 완전히
  롤백한 다음 새 트랜잭션에서 수행한다. 두 번째 충돌은 409 DOCUMENT_NUMBER_CONFLICT; 9999 다음은 4자리 계약을 보존해 409 DOCUMENT_NUMBER_EXHAUSTED로 거부하고 문서/번호/원본을
  변경하지 않는다. 새 연도는 그 연도 최댓값부터 계산한다.

  - OQ-CHANGE-03: 새 제목은 종류별 ''새 견적서''/''새 청구서''. 제목 입력은 기존 ResumeStructureValidator.title처럼 null/공백만 거부하고 별도 길이 제한을 추가하지 않는다.
  문서 생성 기본값은 DEC-203, 복제는 원문대로 제목+'' (사본)'', 변환은 원문 title 복사다.

  - OQ-CHANGE-04: invoice.id/user_id/source_quote_id는 기존 resume/users와 호환되는 PostgreSQL BIGINT, HTTP에서는 기존 ResourceId와 같은 십진
  문자열; 시각은 TIMESTAMPTZ·ISO8601. stampPhotoId는 기존 photo UUID 또는 null. 새 빈 품목의 id는 crypto.randomUUID(), 같은 문서에서 중복 없이 유지; 편집·재정렬·저장
  시 id 보존, 문서 복제/변환은 원문 items 복사대로 id도 보존한다(품목 id는 문서 내 식별자). BigDecimal/long 정수 계산과 프론트 안전 정수 범위로 계산한다.

  - OQ-CHANGE-05: 원문이 요구하지 않은 기한 경과/날짜 역전 업무 차단을 추가하지 않는다. 날짜 형식과 JSON 구조를 검증하며 빈 초안은 저장 가능하다. PDF는 CMN-932의 필수값만 검사한다. 견적서·청구서에
  이력서 완성도·숨김 규칙을 적용하지 않는다.


  검증 인계: 현재 기존 이력서 회귀, 새 계산 단위 시험, invoice 소유 격리·거부 시 DB 불변·번호 충돌/소진·토글 양방향·직렬 자동저장·최신 저장 후 변환/인쇄·PDF 필수 누락·50행 다중 페이지·V3
  적용 및 기존 migration checksum 보존을 실제로 실행한 뒤 완료 판정한다.

